<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Vitra — Card Worth Magazine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #1a1a1a; }
  body {
    width: 1080px;
    height: 1350px;
    background: #0a0a0a;
    font-family: 'Playfair Display', serif;
    color: #f4eee4;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card {
    width: 1004px;
    height: 1274px;
    border: 1.5px solid #b8975e;
    padding: 120px 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .quote-mark {
    font-family: 'Playfair Display', serif;
    font-size: 180px;
    font-weight: 400;
    color: #b8975e;
    line-height: 0.6;
    margin-bottom: 24px;
    opacity: 0.85;
  }
  .quote {
    font-weight: 400;
    font-style: italic;
    font-size: 64px;
    line-height: 1.25;
    color: #f4eee4;
    letter-spacing: 0.005em;
    margin-bottom: 72px;
    max-width: 780px;
  }
  .rule {
    width: 80px;
    height: 1px;
    background: #b8975e;
    margin: 0 auto 48px;
  }
  .attribution {
    font-weight: 400;
    font-size: 32px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #b8975e;
  }
  .year {
    margin-top: 14px;
    font-weight: 300;
    font-size: 26px;
    letter-spacing: 0.3em;
    color: #8a8275;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="quote-mark">&ldquo;</div>
    <div class="quote">
      One of the Best<br>
      Residential Buildings<br>
      of the Year
    </div>
    <div class="rule"></div>
    <div class="attribution">Worth Magazine</div>
    <div class="year">2015</div>
  </div>
</body>
</html>
