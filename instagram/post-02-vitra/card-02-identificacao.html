<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Vitra — Card Identificação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #1a1a1a; }
  body {
    width: 1080px;
    height: 1350px;
    background: #0a0a0a;
    font-family: 'Playfair Display', serif;
    color: #f4eee4;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card {
    width: 1004px;
    height: 1274px;
    border: 1.5px solid #b8975e;
    padding: 120px 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .title {
    font-weight: 400;
    font-size: 96px;
    letter-spacing: 0.02em;
    line-height: 1.05;
    color: #f4eee4;
    margin-bottom: 56px;
  }
  .rule {
    width: 80px;
    height: 1px;
    background: #b8975e;
    margin: 0 auto 56px;
  }
  .credits {
    font-weight: 300;
    font-size: 36px;
    line-height: 1.7;
    color: #d9d2c4;
    letter-spacing: 0.04em;
  }
  .credits .role {
    color: #8a8275;
    font-style: italic;
    font-size: 28px;
    letter-spacing: 0.06em;
  }
  .location {
    margin-top: 56px;
    font-weight: 400;
    font-size: 32px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #b8975e;
  }
  .year {
    margin-top: 16px;
    font-weight: 300;
    font-size: 28px;
    letter-spacing: 0.3em;
    color: #8a8275;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="title">Edifício<br>Vitra</div>
    <div class="rule"></div>
    <div class="credits">
      <div><span class="role">Projeto</span></div>
      <div>Studio Libeskind</div>
      <div>+ PSA Arquitetura</div>
      <div style="height: 24px;"></div>
      <div><span class="role">Empreendedor</span></div>
      <div>JHSF</div>
    </div>
    <div class="location">Itaim Bibi · São Paulo</div>
    <div class="year">2015</div>
  </div>
</body>
</html>
