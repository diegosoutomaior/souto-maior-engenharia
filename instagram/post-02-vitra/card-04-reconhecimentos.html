<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Vitra — Card Reconhecimentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #1a1a1a; }
  body {
    width: 1080px;
    height: 1350px;
    background: #0a0a0a;
    font-family: 'Playfair Display', serif;
    color: #f4eee4;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card {
    width: 1004px;
    height: 1274px;
    border: 1.5px solid #b8975e;
    padding: 110px 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .eyebrow {
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #b8975e;
    margin-bottom: 80px;
  }
  .award {
    width: 100%;
  }
  .award + .award {
    margin-top: 56px;
    padding-top: 56px;
    border-top: 1px solid rgba(184, 151, 94, 0.35);
  }
  .award-title {
    font-weight: 400;
    font-style: italic;
    font-size: 40px;
    line-height: 1.3;
    color: #f4eee4;
    margin-bottom: 18px;
  }
  .award-source {
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #b8975e;
  }
  .award-year {
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 0.28em;
    color: #8a8275;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Reconhecimentos</div>

    <div class="award">
      <div class="award-title">Melhores Edifícios<br>Residenciais do Ano</div>
      <div class="award-source">Worth Magazine</div>
      <div class="award-year">2 0 1 5</div>
    </div>

    <div class="award">
      <div class="award-title">Featured Project</div>
      <div class="award-source">CTBUH</div>
      <div class="award-year">2 0 1 5</div>
    </div>

    <div class="award">
      <div class="award-title">Building of the Year<br>3º lugar</div>
      <div class="award-source">World Architects</div>
      <div class="award-year">2 0 1 6</div>
    </div>

  </div>
</body>
</html>
